[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc-lulc"
version = "0.1.0"
description = "Land Use / Land Cover classification pipeline using Microsoft Planetary Computer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "stackstac>=0.4",
    "xarray>=2023.1",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "geopandas>=0.13",
    "shapely>=2.0",
    "pyproj>=3.5",
    "spyndex>=0.9",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "dask>=2023.1",
    "dask[distributed]>=2023.1",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
    "affine>=2.4",
    "tqdm>=4.65",
    "odc-stac>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
